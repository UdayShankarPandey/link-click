# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - link-click-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Run frontend lint
        run: npm run lint
        working-directory: ./client

      - name: Build frontend app
        run: npm run build
        working-directory: ./client
        env:
          VITE_API_URL: https://link-click-api.azurewebsites.net/api

      - name: Prune dev dependencies for production runtime
        run: npm prune --omit=dev
        working-directory: ./client

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./client

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_20409DA653754169B8526B4D05FF3E55 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_183F011D01654D10BA1DED49BB44FD98 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_26EAE191283F4647B374954B7D85352E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'link-click-frontend'
          slot-name: 'Production'
          package: .