# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - link-click-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)

      - name: Set up Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: ./client

      - name: Run frontend lint
        run: npm run lint
        working-directory: ./client

      - name: Build frontend app
        run: npm run build
        working-directory: ./client
        env:
          VITE_API_URL: https://link-click-api.azurewebsites.net/api

      - name: Prune dev dependencies for production runtime
        run: npm prune --omit=dev
        working-directory: ./client

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (v4.6.2)
        with:
          name: node-app
          path: ./client

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (v4.3.0)
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2 (v2.3.0)
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_20409DA653754169B8526B4D05FF3E55 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_183F011D01654D10BA1DED49BB44FD98 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_26EAE191283F4647B374954B7D85352E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3 (v3.0.8)
        with:
          app-name: 'link-click-frontend'
          slot-name: 'Production'
          package: .